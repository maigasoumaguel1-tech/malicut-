name: MALICUT Studio checks

on:
  push:
    branches:
      - main
      - feature/malicut-studio-operational-rebuild
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check studio scripts
        run: |
          node --check studio-pro.js
          node --check global-studio.js
