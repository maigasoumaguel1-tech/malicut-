name: MALICUT Studio checks

on:
  push:
    branches:
      - main
      - feature/malicut-studio-operational-rebuild
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check studio scripts
        run: |
          node --check studio-pro.js
          node --check global-studio.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("app.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b(?![^>]*\\bsrc=)[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          Path("/tmp/malicut-inline.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/malicut-inline.js
